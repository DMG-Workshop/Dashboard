dashboard:
  title: "U-Dash Dashboard"
  description: "Your personalized homelab dashboard."

quick_launch:
  - name: "Home"
    icon: "fa fa-home"
    url: "/"

links:
  - name: "Web Server"
    icon: "fa fa-server"
    url: "http://localhost:8080"
  - name: "Pi-hole"
    icon: "fa fa-shield-alt"
    url: "http://localhost:3001"
  - name: "Nextcloud"
    icon: "fa fa-cloud-upload-alt"
    url: "http://localhost:9000"

widgets:
  - type: "weather"
    title: "Weather"
    api_key: "YOUR_API_KEY"
    city: "New York"
  - type: "calendar"
    title: "Calendar"
    calendar_url: "https://your-calendar-url.com"